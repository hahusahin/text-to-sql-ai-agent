<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 866" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="aT" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <marker id="aTb" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3 L7,6 Z" fill="#0d9488"/>
    </marker>
    <style>
      .h     { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .sub   { font-size: 14px; fill: #64748b; }
      .sec   { font-size: 15px; font-weight: 800; }
      .main  { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 12.5px; fill: #64748b; }
      .lbl   { font-size: 12px; font-weight: 600; }
      .mono  { font-family: 'Consolas','SF Mono',monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="866" fill="#f8fafc"/>
  <text x="500" y="44" text-anchor="middle" class="h">How the agent answers a question</text>
  <text x="500" y="70" text-anchor="middle" class="sub">The AI works step by step — it looks at the data, writes SQL, checks the result, and fixes itself if needed</text>

  <!-- CLIENT -->
  <rect x="290" y="88" width="420" height="82" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="116" text-anchor="middle" class="main">🧑  Client</text>
  <text x="500" y="138" text-anchor="middle" class="small">asks a question in plain language:</text>
  <text x="500" y="158" text-anchor="middle" class="small">“Which line had the most breakdowns last month?”</text>

  <line x1="500" y1="170" x2="500" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- BACKEND -->
  <rect x="350" y="198" width="300" height="62" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="225" text-anchor="middle" class="main">⚙️  Backend service (FastAPI)</text>
  <text x="500" y="246" text-anchor="middle" class="small">runs the agent</text>

  <!-- ============ AGENT LOOP CONTAINER ============ -->
  <rect x="40" y="296" width="920" height="330" rx="18" fill="#faf7ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="60" y="326" class="sec" fill="#6d28d9">🔁  THE AGENT LOOP — repeats until it can answer</text>

  <!-- question into the agent -->
  <path d="M500,262 C500,320 486,348 446,366" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- AI AGENT (the main actor) -->
  <rect x="95" y="366" width="370" height="200" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.6"/>
  <text x="280" y="416" text-anchor="middle" class="main" font-size="18">🤖  The AI agent</text>
  <text x="280" y="440" text-anchor="middle" class="small mono">gpt-5.4-mini</text>
  <text x="280" y="476" text-anchor="middle" class="small">decides what to do next</text>
  <text x="280" y="497" text-anchor="middle" class="small">and writes the SQL</text>

  <!-- TOOLS (narrow helpers) -->
  <rect x="600" y="360" width="320" height="228" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="616" y="382" class="lbl" fill="#475569">TOOLS it can use</text>

  <rect x="614" y="392" width="292" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="630" y="416" class="main mono" font-size="13.5">🗂️ get_schema()</text>
  <text x="630" y="436" class="small">see the tables &amp; columns</text>

  <rect x="614" y="456" width="292" height="56" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="630" y="480" class="main mono" font-size="13.5">🛠️ run_query(sql)</text>
  <text x="630" y="500" class="small">run it, get the rows back (or the error)</text>

  <rect x="614" y="520" width="292" height="56" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="630" y="544" class="main mono" font-size="13.5">🔎 search_notes(query)</text>
  <text x="630" y="564" class="small">search the notes by meaning</text>

  <!-- the loop between agent and tools -->
  <line x1="467" y1="446" x2="596" y2="446" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="531" y="438" text-anchor="middle" class="lbl" fill="#475569">picks a tool</text>
  <text x="531" y="472" text-anchor="middle" class="lbl" fill="#6d28d9">↻  up to 6×</text>
  <line x1="596" y1="500" x2="467" y2="500" stroke="#8b5cf6" stroke-width="2" marker-end="url(#aR)"/>
  <text x="531" y="520" text-anchor="middle" class="lbl" fill="#6d28d9">reads the result</text>

  <!-- agent has the answer -> leaves the loop -->
  <line x1="280" y1="566" x2="280" y2="650" stroke="#16a34a" stroke-width="2" marker-end="url(#aG)"/>
  <text x="298" y="612" class="lbl" fill="#15803d">has the answer</text>

  <!-- tools reach down to the database -->
  <path d="M760,588 L745,650" fill="none" stroke="#0d9488" stroke-width="2" marker-start="url(#aTb)" marker-end="url(#aT)"/>
  <text x="690" y="610" class="lbl" fill="#0f766e">reads the data</text>

  <!-- ============ ANSWER + DATABASE (below the loop) ============ -->
  <rect x="90" y="652" width="380" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
  <text x="280" y="682" text-anchor="middle" class="main">✅  A plain-language answer</text>
  <text x="280" y="703" text-anchor="middle" class="small">with the SQL it ran and the results</text>

  <rect x="560" y="652" width="360" height="64" rx="12" fill="#ecfeff" stroke="#0d9488" stroke-width="2.4"/>
  <text x="740" y="682" text-anchor="middle" class="main">🗄️  The factory database</text>
  <text x="740" y="703" text-anchor="middle" class="small mono">PostgreSQL + pgvector</text>

  <!-- answer returns to the client -->
  <path d="M90,684 L24,684 L24,132 L286,132" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#aG)"/>
  <text transform="rotate(-90 16 408)" x="16" y="408" text-anchor="middle" class="lbl" fill="#15803d">answer sent back to the client</text>

  <!-- ============ FOOTERS ============ -->
  <rect x="40" y="748" width="920" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="776" class="main">🧭  Observability</text>
  <text x="210" y="776" class="small">every step is recorded, so a slow or wrong run can be traced later</text>

  <rect x="40" y="804" width="920" height="46" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="64" y="833" class="main" fill="#92400e">🔒  Guardrails</text>
  <text x="196" y="833" class="small" fill="#78350f">the database is read-only — the agent can look, but never change or delete anything</text>
</svg>

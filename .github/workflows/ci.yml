name: ci

# The health check that runs before code is trusted. On every push and PR we
# lint, verify formatting, and prove the app still imports (our Python "build
# check"). The CD workflow depends on this passing, so a red run blocks deploy.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Poetry project lives in backend/, so all steps run from there.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        # pipx is preinstalled on GitHub runners; this puts `poetry` on PATH.
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Cache the Poetry-managed virtualenv keyed off poetry.lock.
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff check)
        run: poetry run ruff check .

      - name: Formatting (ruff format --check)
        run: poetry run ruff format --check .

      - name: Build check (import smoke test)
        # Python has no compile step; importing the app proves it loads without
        # syntax/import errors — the analogue of `npm run build` failing. Dummy
        # env satisfies the required Settings fields; nothing actually connects.
        env:
          DATABASE_URL_READONLY: "postgresql://x:x@localhost/x"
          API_KEY: "ci-dummy"
          OPENAI_API_KEY: "ci-dummy"
        run: poetry run python -c "import app.main; print('import OK')"

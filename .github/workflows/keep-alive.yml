name: keep-alive

# Two free tiers go to sleep if nobody shows up, and a portfolio link can sit
# untouched for days:
#   - the Hugging Face Space (backend) sleeps after 48h idle;
#   - the Supabase project (Postgres) is paused after ~7 days with no database
#     activity.
# One daily request to /health/db covers both: it wakes the Space *and* runs a
# SELECT against Postgres, which is the traffic Supabase actually counts.
# Pinging plain /health would keep the Space warm but leave the database idle.
# Vercel is serverless and never sleeps, so the frontend needs nothing.
#
# Caveat this workflow cannot fix by itself: GitHub disables a scheduled
# workflow after 60 days without *repository activity*. The counter tracks
# pushes, not workflow runs, so these daily green runs do not reset it -- a
# repo left untouched for 60 days loses its cron even while the cron is
# working. Any push to master resets the clock; if it does get disabled, the
# file stays and `gh workflow enable keep-alive.yml` brings it back.

on:
  schedule:
    # Daily at 06:00 UTC — inside the 48h Space window, with a wide margin on the
    # 7-day Supabase window, and room for GitHub's scheduling delays under load.
    - cron: "0 6 * * *"
  # Lets us trigger a run by hand from the Actions tab (handy for testing).
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health/db
        # -f fails the job on a non-2xx response, so a dead backend or an
        # unreachable database (503) is visible in the Actions tab instead of
        # silently passing. -m 60 leaves room for a cold Space start.
        run: curl -fsS -m 60 https://hahusahin-text-to-sql-ai-service.hf.space/health/db
